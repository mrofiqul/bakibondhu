<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>বাকিবন্ধু</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#17694A; --green-deep:#0d5233; --green-soft:#e4f0ea;
    --owed:#9C3B2E; --bg:#F7F5F0; --surface:#ffffff; --border:#e3e6df;
    --ink:#1a201b; --muted:#6b746c; --shadow:0 1px 3px rgba(20,40,25,.08),0 6px 20px rgba(20,40,25,.05);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Noto Sans Bengali","Segoe UI",system-ui,sans-serif;
    font-size:15.5px; line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer}
  input{font-family:inherit}
  .wrap{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative}

  /* top bar */
  .top{position:sticky;top:0;z-index:5;background:var(--green);color:#fff;padding:14px 16px;
    display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
  .top .brand{font-size:20px;font-weight:700;flex:1}
  .top .ib{background:rgba(255,255,255,.16);border:0;color:#fff;width:38px;height:38px;border-radius:10px;
    font-size:17px;display:grid;place-items:center}
  .top .ib:active{background:rgba(255,255,255,.3)}
  .back{background:transparent;border:0;color:#fff;font-size:22px;padding:0 4px 0 0}

  main{padding:16px}

  /* cards */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
  .hero{background:var(--green-soft);border:1px solid #cfe3d7;border-radius:18px;padding:18px 20px;margin-bottom:14px}
  .hero .lbl{color:var(--green-deep);font-size:14px;font-weight:500}
  .hero .amt{font-size:34px;font-weight:700;color:var(--green-deep);letter-spacing:-.5px;margin-top:2px}
  .hero .sub{color:var(--muted);font-size:13.5px;margin-top:2px}
  .rowcard{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);
    border-radius:14px;padding:13px 16px;margin-bottom:12px;box-shadow:var(--shadow);width:100%;text-align:right;text-align:start}
  .rowcard .ico{width:34px;height:34px;border-radius:9px;background:var(--green-soft);color:var(--green-deep);
    display:grid;place-items:center;font-size:17px;flex:none}
  .rowcard .gr{flex:1}
  .rowcard .t{font-weight:600}
  .rowcard .s{color:var(--muted);font-size:13px}
  .rowcard .chev{color:var(--muted)}

  /* search */
  .search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);
    border-radius:12px;padding:0 12px;margin:4px 0 14px}
  .search input{border:0;outline:0;padding:12px 4px;width:100%;background:transparent;font-size:15px}
  .search .si{color:var(--muted)}

  /* customer list */
  .clist{list-style:none;margin:0;padding:0}
  .citem{display:flex;align-items:center;gap:12px;padding:13px 6px;border-bottom:1px solid var(--border);
    width:100%;background:transparent;border-left:0;border-right:0;border-top:0;text-align:start}
  .citem:last-child{border-bottom:0}
  .av{width:42px;height:42px;border-radius:50%;background:var(--green-soft);color:var(--green-deep);
    display:grid;place-items:center;font-size:18px;font-weight:600;flex:none}
  .citem .nm{flex:1;min-width:0}
  .citem .nm b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .citem .nm span{color:var(--muted);font-size:13px}
  .due{color:var(--owed);font-weight:700;white-space:nowrap}
  .settled{color:var(--muted);font-size:13.5px;white-space:nowrap}

  .empty{text-align:center;color:var(--muted);padding:48px 20px}
  .empty .em{font-size:40px;margin-bottom:8px}

  /* FAB */
  .fab{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--green);color:#fff;border:0;
    border-radius:999px;padding:14px 22px;font-size:16px;font-weight:600;box-shadow:0 6px 18px rgba(23,105,74,.4);
    display:flex;align-items:center;gap:8px;z-index:6}
  .fab:active{background:var(--green-deep)}

  /* detail */
  .balhead{padding:8px 4px 18px}
  .balhead .ph{color:var(--muted);font-size:14px;display:flex;align-items:center;gap:6px}
  .balhead .lbl{color:var(--muted);font-size:14px;margin-top:10px}
  .balhead .big{font-size:32px;font-weight:700;margin-top:2px}
  .balhead .big.owed{color:var(--owed)}
  .balhead .big.ok{color:var(--muted)}
  .actions{display:flex;gap:10px;margin:6px 0 14px}
  .actions button{flex:1;border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:600;
    display:flex;align-items:center;justify-content:center;gap:6px}
  .b-credit{background:var(--green-soft);color:var(--green-deep)}
  .b-pay{background:var(--green);color:#fff}
  .hitem{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--border)}
  .hitem .hi{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
  .hi.up{background:#fbe7e3;color:var(--owed)} .hi.down{background:var(--green-soft);color:var(--green-deep)}
  .hitem .hg{flex:1}
  .hitem .hg .ht{font-weight:500}
  .hitem .hg .hs{color:var(--muted);font-size:12.5px}
  .hamt{font-weight:700}.hamt.up{color:var(--owed)}.hamt.down{color:var(--green-deep)}

  /* period toggle */
  .seg{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:14px}
  .seg button{flex:1;border:0;background:transparent;padding:10px 4px;font-size:13.5px;color:var(--muted)}
  .seg button.on{background:var(--green);color:#fff;font-weight:600}

  /* modal */
  .mask{position:fixed;inset:0;background:rgba(20,30,22,.45);display:grid;place-items:end center;z-index:20}
  .sheet{background:var(--surface);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 18px 22px;
    box-shadow:0 -6px 30px rgba(0,0,0,.2);animation:up .18s ease}
  @keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
  .sheet h3{margin:2px 0 14px;font-size:18px}
  label.fl{display:block;font-size:13px;color:var(--muted);margin:10px 0 5px}
  .in{width:100%;padding:12px 13px;border:1px solid var(--border);border-radius:11px;font-size:16px;outline:0}
  .in:focus{border-color:var(--green)}
  .amtbig{font-size:26px;font-weight:700;text-align:center;letter-spacing:1px}
  .sheet .go{width:100%;margin-top:16px;background:var(--green);color:#fff;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:600}
  .sheet .go:disabled{opacity:.5}
  .sheet .cancel{width:100%;margin-top:8px;background:transparent;border:0;color:var(--muted);padding:8px;font-size:14px}
  .err{color:var(--owed);font-size:13.5px;margin-top:10px;min-height:18px}
  .seg2{display:flex;gap:8px;margin-bottom:6px}
  .seg2 button{flex:1;border:1px solid var(--border);background:var(--surface);border-radius:11px;padding:11px;font-weight:600;color:var(--muted)}
  .seg2 button.on.credit{background:#fbe7e3;color:var(--owed);border-color:#f0c9c1}
  .seg2 button.on.pay{background:var(--green-soft);color:var(--green-deep);border-color:#bfe0cd}

  /* auth */
  .auth{max-width:400px;margin:0 auto;padding:40px 22px}
  .auth .logo{text-align:center;margin-bottom:6px}
  .auth .logo .bn{font-size:32px;font-weight:700;color:var(--green)}
  .auth .logo .tag{color:var(--muted);font-size:14px}
  .auth .box{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px;margin-top:22px;box-shadow:var(--shadow)}
  .auth h2{margin:0 0 4px;font-size:19px}
  .auth .toggle{text-align:center;margin-top:16px;color:var(--green-deep);background:none;border:0;font-size:14.5px;width:100%}

  .toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#232a24;color:#fff;
    padding:11px 18px;border-radius:10px;font-size:14px;z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:90%}
  .spin{width:18px;height:18px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;
    display:inline-block;animation:sp .7s linear infinite;vertical-align:-3px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .loading{display:grid;place-items:center;min-height:60vh;color:var(--muted)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
(function(){
"use strict";
// ---------- config / state ----------
var API = "/api/v1";
var LS = { tok:"bb_web_tok", biz:"bb_web_biz", shop:"bb_web_shop", dev:"bb_web_dev" };
var S = {
  token: localStorage.getItem(LS.tok) || null,
  businessId: localStorage.getItem(LS.biz) || null,
  shopName: localStorage.getItem(LS.shop) || "",
  deviceId: localStorage.getItem(LS.dev) || null,
  customers: [], txns: [], sales: [], expiresAt: null,
};
if (!S.deviceId){ S.deviceId = "web-" + uuid(); localStorage.setItem(LS.dev, S.deviceId); }
var view = { name: "home", customerId: null, salesPeriod: "day" };
var query = "";

function uuid(){ return (crypto.randomUUID && crypto.randomUUID()) ||
  "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,function(c){var r=Math.random()*16|0,v=c=="x"?r:(r&0x3|0x8);return v.toString(16);}); }

// ---------- api ----------
function api(path, opts){
  opts = opts || {};
  var h = { "Content-Type":"application/json" };
  if (opts.auth !== false && S.token) h["Authorization"] = "Bearer " + S.token;
  return fetch(API + path, {
    method: opts.method || "GET",
    headers: h,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
    credentials: "same-origin",
  }).then(function(r){
    return r.text().then(function(t){
      var j = null; try { j = t ? JSON.parse(t) : null; } catch(e){}
      if (!r.ok) { var err = new Error((j&&j.error&&j.error.message)||("HTTP "+r.status)); err.code=(j&&j.error&&j.error.code)||("http_"+r.status); err.status=r.status; throw err; }
      return j;
    });
  });
}

// ---------- money / balance ----------
function taka(paisa){
  var n = (paisa||0)/100;
  var s = (Math.round(n*100)/100).toLocaleString("en-US",{maximumFractionDigits:2});
  return "৳" + s;
}
var SIGN = { credit:1, payment:-1, adjustment_debit:1, adjustment_credit:-1 };
function balanceOf(customerId){
  var b = 0;
  for (var i=0;i<S.txns.length;i++){ var t=S.txns[i]; if(t.customer_id===customerId){ b += (SIGN[t.type]||0)*(t.amount_paisa||0); } }
  return b;
}
function totalReceivable(){ var sum=0; for(var i=0;i<S.customers.length;i++){ var b=balanceOf(S.customers[i].id); if(b>0) sum+=b; } return sum; }
function txnsOf(id){ return S.txns.filter(function(t){return t.customer_id===id;})
  .sort(function(a,b){ return (b.updated_at||"").localeCompare(a.updated_at||""); }); }

// Bangladesh "today" (UTC+6) as YYYY-MM-DD
function bdToday(){ var d=new Date(Date.now()+6*3600*1000); return d.toISOString().slice(0,10); }
function bdDateOf(utcStr){ if(!utcStr) return ""; var d=new Date(utcStr.replace(" ","T")+"Z"); if(isNaN(d)) return String(utcStr).slice(0,10); return new Date(d.getTime()+6*3600*1000).toISOString().slice(0,10); }
function todaysSales(){ var t=bdToday(),sum=0; for(var i=0;i<S.sales.length;i++){ if(bdDateOf(S.sales[i].sold_at)===t) sum+=(S.sales[i].amount_paisa||0);} return sum; }

// ---------- sync ----------
function pullAll(){
  return api("/sync/pull?since=&device_id=" + encodeURIComponent(S.deviceId)).then(function(d){
    S.customers = d.customers||[]; S.txns = d.transactions||[]; S.sales = d.sales||[]; S.expiresAt = d.expires_at||null;
  });
}
function push(changes){
  return api("/sync/push", { method:"POST", body:{ device_id:S.deviceId, changes:changes } });
}
function nowUtc(){ return new Date().toISOString().slice(0,19).replace("T"," "); }

// ---------- auth ----------
function saveSession(res){
  S.token = res.tokens.access_token; S.businessId = res.business_id || (res.business&&res.business.id) || null;
  localStorage.setItem(LS.tok,S.token); if(S.businessId) localStorage.setItem(LS.biz,S.businessId);
}
function logout(){ [LS.tok,LS.biz,LS.shop].forEach(function(k){localStorage.removeItem(k);}); S.token=null;S.customers=[];S.txns=[];S.sales=[]; view={name:"home"}; render(); }

// ---------- helpers ----------
var app = document.getElementById("app");
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function el(html){ var d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstChild; }
function toast(msg){ var t=el('<div class="toast">'+esc(msg)+'</div>'); document.body.appendChild(t); setTimeout(function(){t.remove();},2200); }
function initials(n){ n=(n||"").trim(); return n? n[0] : "?"; }
function go(v){ view=v; query=""; window.scrollTo(0,0); render(); }

// ---------- views ----------
function render(){
  if (!S.token){ renderAuth(); return; }
  if (view.name==="customer"){ renderCustomer(); return; }
  if (view.name==="sales"){ renderSales(); return; }
  renderHome();
}

function loadingScreen(){ app.innerHTML=''; app.appendChild(el('<div class="loading"><div><span class="spin" style="border-color:#cbd5cd;border-top-color:var(--green)"></span> লোড হচ্ছে…</div></div>')); }

// ---- AUTH ----
var authMode = "login";
function renderAuth(){
  app.innerHTML = "";
  var isLogin = authMode==="login";
  var box = el(
    '<div class="auth">'+
      '<div class="logo"><div class="bn">বাকিবন্ধু</div><div class="tag">বাকির হিসাব — সহজে, অনলাইনে</div></div>'+
      '<div class="box">'+
        '<h2>'+(isLogin?"লগ ইন করুন":"নতুন অ্যাকাউন্ট")+'</h2>'+
        (isLogin? "" :
          '<label class="fl">আপনার নাম</label><input class="in" id="f_name" autocomplete="name">'+
          '<label class="fl">দোকানের নাম</label><input class="in" id="f_shop">')+
        '<label class="fl">মোবাইল নম্বর</label><input class="in" id="f_phone" inputmode="numeric" autocomplete="username" placeholder="01XXXXXXXXX">'+
        '<label class="fl">পাসওয়ার্ড</label><input class="in" id="f_pass" type="password" autocomplete="'+(isLogin?"current":"new")+'-password">'+
        '<div class="err" id="f_err"></div>'+
        '<button class="go" id="f_go">'+(isLogin?"লগ ইন":"নিবন্ধন করুন")+'</button>'+
        '<button class="toggle" id="f_tog">'+(isLogin?"নতুন? অ্যাকাউন্ট খুলুন":"অ্যাকাউন্ট আছে? লগ ইন করুন")+'</button>'+
      '</div>'+
    '</div>');
  app.appendChild(box);
  document.getElementById("f_tog").onclick=function(){ authMode=isLogin?"register":"login"; renderAuth(); };
  document.getElementById("f_go").onclick=submitAuth;
  box.querySelectorAll("input").forEach(function(i){ i.addEventListener("keydown",function(e){ if(e.key==="Enter") submitAuth(); }); });
}
function submitAuth(){
  var isLogin = authMode==="login";
  var err=document.getElementById("f_err"), btn=document.getElementById("f_go");
  var phone=(document.getElementById("f_phone").value||"").replace(/\D/g,"");
  var pass=document.getElementById("f_pass").value||"";
  if(phone.startsWith("880")) phone="0"+phone.slice(3);
  err.textContent="";
  if(!/^01[3-9]\d{8}$/.test(phone)){ err.textContent="সঠিক মোবাইল নম্বর দিন (১১ সংখ্যা, 01…)"; return; }
  if(pass.length<6){ err.textContent="কমপক্ষে ৬ অক্ষরের পাসওয়ার্ড দিন"; return; }
  var body, path;
  if(isLogin){ path="/auth/login"; body={identifier:phone, password:pass}; }
  else {
    var name=(document.getElementById("f_name").value||"").trim();
    var shop=(document.getElementById("f_shop").value||"").trim();
    if(!name){ err.textContent="আপনার নাম দিন"; return; }
    if(!shop){ err.textContent="দোকানের নাম দিন"; return; }
    path="/auth/register"; body={name:name, phone:phone, password:pass, business_name:shop};
  }
  btn.disabled=true; btn.innerHTML='<span class="spin"></span>';
  api(path,{method:"POST",body:body,auth:false}).then(function(res){
    saveSession(res);
    if(!isLogin){ S.shopName=body.business_name; localStorage.setItem(LS.shop,S.shopName); }
    return afterLogin();
  }).catch(function(e){
    btn.disabled=false; btn.textContent=isLogin?"লগ ইন":"নিবন্ধন করুন";
    err.textContent = friendly(e);
  });
}
function friendly(e){
  if(e.code==="invalid_credentials") return "মোবাইল নম্বর বা পাসওয়ার্ড ভুল";
  if(e.code==="conflict") return "এই নম্বর দিয়ে আগেই অ্যাকাউন্ট আছে — লগ ইন করুন";
  if(e.code==="account_expired") return "সাবস্ক্রিপশনের মেয়াদ শেষ — অ্যাডমিনের সাথে যোগাযোগ করুন";
  if(e.code==="account_suspended") return "অ্যাকাউন্ট সাসপেন্ড করা হয়েছে";
  if(e.status===0 || e.code && e.code.indexOf("http_")===0) return "সংযোগ সমস্যা — আবার চেষ্টা করুন";
  return e.message || "একটি সমস্যা হয়েছে";
}
function afterLogin(){ view={name:"home"}; loadingScreen(); return pullAll().then(render).catch(function(e){ toast(friendly(e)); render(); }); }

// ---- top bar ----
function topBar(title, opts){
  opts=opts||{};
  var left = opts.back ? '<button class="back" id="t_back">‹</button>' : '';
  var right = opts.right || '';
  var t = el('<div class="top">'+left+'<div class="brand">'+esc(title)+'</div>'+right+'</div>');
  if(opts.back){ t.querySelector("#t_back").onclick=opts.back; }
  return t;
}

// ---- HOME ----
function renderHome(){
  app.innerHTML="";
  var shop = S.shopName || "বাকিবন্ধু";
  app.appendChild(topBar(shop, { right:
    '<button class="ib" id="t_sales" title="বিক্রি">📈</button>'+
    '<button class="ib" id="t_sync" title="রিফ্রেশ">⟳</button>'+
    '<button class="ib" id="t_out" title="লগ আউট">⎋</button>' }));
  var m = el('<main></main>');
  var recv = totalReceivable();
  m.appendChild(el('<div class="hero"><div class="lbl">মোট বাকি — আপনার পাওনা</div>'+
    '<div class="amt">'+taka(recv)+'</div><div class="sub">'+S.customers.length+' জন কাস্টমার</div></div>'));
  m.appendChild(el('<button class="rowcard" id="salescard"><div class="ico">📈</div>'+
    '<div class="gr"><div class="t">আজকের বিক্রি</div><div class="s">বিক্রির হিসাব দেখুন</div></div>'+
    '<div class="due" style="color:var(--green-deep)">'+taka(todaysSales())+'</div><div class="chev">›</div></button>'));
  m.appendChild(el('<div class="search"><span class="si">🔍</span><input id="q" placeholder="নাম বা মোবাইল দিয়ে খুঁজুন" value="'+esc(query)+'"></div>'));

  var list = S.customers.map(function(c){ return { c:c, bal:balanceOf(c.id) }; });
  var q = query.trim().toLowerCase();
  if(q) list = list.filter(function(x){ return (x.c.name||"").toLowerCase().indexOf(q)>=0 || (x.c.phone||"").indexOf(q)>=0; });
  list.sort(function(a,b){ return b.bal-a.bal; });

  if(S.customers.length===0){
    m.appendChild(el('<div class="empty"><div class="em">🧾</div><div>এখনো কোনো কাস্টমার নেই।<br>নিচের বাটন দিয়ে প্রথম কাস্টমার যোগ করুন।</div></div>'));
  } else if(list.length===0){
    m.appendChild(el('<div class="empty"><div class="em">🔍</div><div>"'+esc(query)+'" — কিছু পাওয়া যায়নি</div></div>'));
  } else {
    var ul=el('<ul class="clist"></ul>');
    list.forEach(function(x){
      var right = x.bal>0 ? '<span class="due">'+taka(x.bal)+' বাকি</span>' : '<span class="settled">পরিশোধিত</span>';
      var it=el('<button class="citem"><div class="av">'+esc(initials(x.c.name))+'</div>'+
        '<div class="nm"><b>'+esc(x.c.name)+'</b>'+(x.c.phone?'<span>'+esc(x.c.phone)+'</span>':'')+'</div>'+right+'</button>');
      it.onclick=function(){ go({name:"customer", customerId:x.c.id}); };
      ul.appendChild(it);
    });
    m.appendChild(ul);
  }
  app.appendChild(m);
  var fab=el('<button class="fab" id="fab">＋ নতুন কাস্টমার</button>');
  app.appendChild(fab);

  document.getElementById("t_sales").onclick=function(){ go({name:"sales",salesPeriod:"day"}); };
  document.getElementById("salescard").onclick=function(){ go({name:"sales",salesPeriod:"day"}); };
  document.getElementById("t_out").onclick=function(){ if(confirm("লগ আউট করবেন?")) logout(); };
  document.getElementById("t_sync").onclick=function(){ var b=document.getElementById("t_sync"); b.innerHTML='<span class="spin"></span>'; pullAll().then(function(){toast("আপডেট হয়েছে");render();}).catch(function(e){toast(friendly(e));render();}); };
  fab.onclick=addCustomerSheet;
  var qi=document.getElementById("q"); qi.oninput=function(){ query=qi.value; var pos=qi.selectionStart; renderHome(); var n=document.getElementById("q"); n.focus(); try{n.setSelectionRange(pos,pos);}catch(e){} };
}

// ---- CUSTOMER DETAIL ----
function renderCustomer(){
  var c = S.customers.filter(function(x){return x.id===view.customerId;})[0];
  if(!c){ go({name:"home"}); return; }
  var bal = balanceOf(c.id);
  app.innerHTML="";
  app.appendChild(topBar(c.name, { back:function(){ go({name:"home"}); } }));
  var m=el('<main></main>');
  var h=el('<div class="balhead">'+
    (c.phone?'<div class="ph">📞 '+esc(c.phone)+'</div>':'')+
    '<div class="lbl">এখন বাকি</div>'+
    '<div class="big '+(bal>0?"owed":"ok")+'">'+(bal>0?taka(bal)+' বাকি':"পরিশোধিত")+'</div></div>');
  m.appendChild(h);
  var act=el('<div class="actions">'+
    '<button class="b-credit" id="a_credit">↑ বাকি দিলাম</button>'+
    '<button class="b-pay" id="a_pay">↓ টাকা পেলাম</button></div>');
  m.appendChild(act);
  var hist=txnsOf(c.id);
  if(hist.length===0){ m.appendChild(el('<div class="empty" style="padding:30px"><div>এখনো কোনো লেনদেন নেই</div></div>')); }
  else {
    var box=el('<div></div>');
    hist.forEach(function(t){
      var up=(SIGN[t.type]||0)>0;
      var lbl = t.type==="credit"?"বাকি দিলাম":t.type==="payment"?"টাকা পেলাম":(up?"সমন্বয় (বৃদ্ধি)":"সমন্বয় (হ্রাস)");
      box.appendChild(el('<div class="hitem"><div class="hi '+(up?"up":"down")+'">'+(up?"↑":"↓")+'</div>'+
        '<div class="hg"><div class="ht">'+lbl+'</div><div class="hs">'+esc(bdDateShort(t.updated_at))+(t.note?' · '+esc(t.note):'')+'</div></div>'+
        '<div class="hamt '+(up?"up":"down")+'">'+(up?"+ ":"− ")+taka(t.amount_paisa)+'</div></div>'));
    });
    m.appendChild(box);
  }
  app.appendChild(m);
  document.getElementById("a_credit").onclick=function(){ txnSheet(c,"credit"); };
  document.getElementById("a_pay").onclick=function(){ txnSheet(c,"payment"); };
}
function bdDateShort(utc){ var d=bdDateOf(utc); if(!d) return ""; var p=d.split("-"); return p[2]+"/"+p[1]; }

// ---- SALES ----
function renderSales(){
  app.innerHTML="";
  app.appendChild(topBar("বিক্রির হিসাব", { back:function(){ go({name:"home"}); } }));
  var m=el('<main></main>');
  var period=view.salesPeriod||"day";
  m.appendChild(el('<div class="hero"><div class="lbl">'+({day:"আজকের বিক্রি",month:"এই মাসের বিক্রি",quarter:"এই তিন মাসের বিক্রি",year:"এই বছরের বিক্রি"}[period])+'</div>'+
    '<div class="amt" style="color:var(--green-deep)">'+taka(periodTotal(period))+'</div><div class="sub">'+periodCount(period)+' টি বিক্রি</div></div>'));
  var seg=el('<div class="seg">'+
    ['day','month','quarter','year'].map(function(p){ return '<button data-p="'+p+'" class="'+(p===period?"on":"")+'">'+({day:"দৈনিক",month:"মাসিক",quarter:"ত্রৈমাসিক",year:"বার্ষিক"}[p])+'</button>'; }).join("")+'</div>');
  seg.querySelectorAll("button").forEach(function(b){ b.onclick=function(){ view.salesPeriod=b.getAttribute("data-p"); renderSales(); }; });
  m.appendChild(seg);
  var recent = S.sales.slice().sort(function(a,b){return (b.sold_at||"").localeCompare(a.sold_at||"");}).slice(0,50);
  if(recent.length===0){ m.appendChild(el('<div class="empty"><div class="em">📈</div><div>এখনো কোনো বিক্রি যোগ করা হয়নি</div></div>')); }
  else { var box=el('<div class="card" style="padding:6px 14px"></div>');
    recent.forEach(function(s){ box.appendChild(el('<div class="hitem"><div class="hi down">৳</div>'+
      '<div class="hg"><div class="ht">'+taka(s.amount_paisa)+'</div><div class="hs">'+esc(bdDateShort(s.sold_at))+(s.note?' · '+esc(s.note):'')+'</div></div></div>')); });
    m.appendChild(box);
  }
  app.appendChild(m);
  var fab=el('<button class="fab" id="fab">＋ বিক্রি যোগ করুন</button>'); app.appendChild(fab);
  fab.onclick=addSaleSheet;
}
function salesBucketMatch(s,period){
  var t=bdToday(), d=bdDateOf(s.sold_at); if(!d) return false;
  if(period==="day") return d===t;
  if(period==="month") return d.slice(0,7)===t.slice(0,7);
  if(period==="year") return d.slice(0,4)===t.slice(0,4);
  if(period==="quarter"){ var q=function(m){return Math.floor((parseInt(m,10)-1)/3);}; return d.slice(0,4)===t.slice(0,4) && q(d.slice(5,7))===q(t.slice(5,7)); }
  return false;
}
function periodTotal(p){ var s=0; S.sales.forEach(function(x){ if(salesBucketMatch(x,p)) s+=(x.amount_paisa||0); }); return s; }
function periodCount(p){ var n=0; S.sales.forEach(function(x){ if(salesBucketMatch(x,p)) n++; }); return n; }

// ---------- sheets (modals) ----------
function openSheet(node){ var mask=el('<div class="mask"></div>'); mask.appendChild(node); mask.addEventListener("click",function(e){ if(e.target===mask) mask.remove(); }); document.body.appendChild(mask); return mask; }
function closeSheets(){ document.querySelectorAll(".mask").forEach(function(m){m.remove();}); }

function addCustomerSheet(){
  var sh=el('<div class="sheet"><h3>নতুন কাস্টমার</h3>'+
    '<label class="fl">নাম</label><input class="in" id="c_name">'+
    '<label class="fl">মোবাইল নম্বর</label><input class="in" id="c_phone" inputmode="numeric" placeholder="01XXXXXXXXX">'+
    '<label class="fl">ঠিকানা (ঐচ্ছিক)</label><input class="in" id="c_addr">'+
    '<div class="err" id="c_err"></div>'+
    '<button class="go" id="c_go">যোগ করুন</button>'+
    '<button class="cancel" id="c_cancel">বাতিল</button></div>');
  var mask=openSheet(sh);
  sh.querySelector("#c_cancel").onclick=function(){mask.remove();};
  sh.querySelector("#c_go").onclick=function(){
    var err=sh.querySelector("#c_err"), btn=sh.querySelector("#c_go");
    var name=(sh.querySelector("#c_name").value||"").trim();
    var phone=(sh.querySelector("#c_phone").value||"").replace(/\D/g,""); if(phone.startsWith("880")) phone="0"+phone.slice(3);
    var addr=(sh.querySelector("#c_addr").value||"").trim();
    err.textContent="";
    if(!name){ err.textContent="নাম দিন"; return; }
    if(!/^01[3-9]\d{8}$/.test(phone)){ err.textContent="সঠিক মোবাইল নম্বর দিন"; return; }
    if(S.customers.some(function(c){return c.phone===phone;})){ err.textContent="এই নম্বরের কাস্টমার আগেই আছে"; return; }
    btn.disabled=true; btn.innerHTML='<span class="spin"></span>';
    var lid=uuid();
    push([{ entity:"customer", local_id:lid, op:"upsert", data:{ name:name, phone:phone, address:addr||null } }])
      .then(pullAll).then(function(){ mask.remove(); render(); toast("কাস্টমার যোগ হয়েছে"); })
      .catch(function(e){ btn.disabled=false; btn.textContent="যোগ করুন"; err.textContent=pushErr(e); });
  };
  setTimeout(function(){ sh.querySelector("#c_name").focus(); },50);
}

function txnSheet(c, type){
  var isCredit=type==="credit";
  var sh=el('<div class="sheet"><h3>'+esc(c.name)+'</h3>'+
    '<div class="seg2"><button class="'+(isCredit?"on credit":"")+'" data-t="credit">বাকি দিলাম</button>'+
    '<button class="'+(!isCredit?"on pay":"")+'" data-t="payment">টাকা পেলাম</button></div>'+
    '<label class="fl">পরিমাণ (৳)</label><input class="in amtbig" id="t_amt" inputmode="decimal" placeholder="0">'+
    '<label class="fl">নোট (ঐচ্ছিক)</label><input class="in" id="t_note">'+
    '<div class="err" id="t_err"></div>'+
    '<button class="go" id="t_go"></button>'+
    '<button class="cancel" id="t_cancel">বাতিল</button></div>');
  var cur=type;
  function paint(){ sh.querySelectorAll(".seg2 button").forEach(function(b){ var on=b.getAttribute("data-t")===cur; b.className=on?("on "+(cur==="credit"?"credit":"pay")):""; });
    sh.querySelector("#t_go").textContent = cur==="credit"?"বাকি যোগ করুন":"পরিশোধ যোগ করুন"; }
  sh.querySelectorAll(".seg2 button").forEach(function(b){ b.onclick=function(){ cur=b.getAttribute("data-t"); paint(); }; });
  paint();
  var mask=openSheet(sh);
  sh.querySelector("#t_cancel").onclick=function(){mask.remove();};
  sh.querySelector("#t_go").onclick=function(){
    var err=sh.querySelector("#t_err"), btn=sh.querySelector("#t_go");
    var amt=parseFloat(sh.querySelector("#t_amt").value||"0");
    var note=(sh.querySelector("#t_note").value||"").trim();
    err.textContent="";
    if(!(amt>0)){ err.textContent="সঠিক পরিমাণ দিন"; return; }
    btn.disabled=true; btn.innerHTML='<span class="spin"></span>';
    var lid=uuid();
    push([{ entity:"transaction", local_id:lid, op:"upsert", data:{ customer_local_id:c.id, type:cur, amount_paisa:Math.round(amt*100), created_at:nowUtc(), note:note||null } }])
      .then(pullAll).then(function(){ mask.remove(); render(); toast("যোগ হয়েছে"); })
      .catch(function(e){ btn.disabled=false; paint(); err.textContent=pushErr(e); });
  };
  setTimeout(function(){ sh.querySelector("#t_amt").focus(); },50);
}

function addSaleSheet(){
  var sh=el('<div class="sheet"><h3>বিক্রি যোগ করুন</h3>'+
    '<label class="fl">পরিমাণ (৳)</label><input class="in amtbig" id="s_amt" inputmode="decimal" placeholder="0">'+
    '<label class="fl">বিবরণ (ঐচ্ছিক)</label><input class="in" id="s_note" placeholder="যেমন পণ্যের নাম">'+
    '<div class="err" id="s_err"></div>'+
    '<button class="go" id="s_go">যোগ করুন</button>'+
    '<button class="cancel" id="s_cancel">বাতিল</button></div>');
  var mask=openSheet(sh);
  sh.querySelector("#s_cancel").onclick=function(){mask.remove();};
  sh.querySelector("#s_go").onclick=function(){
    var err=sh.querySelector("#s_err"), btn=sh.querySelector("#s_go");
    var amt=parseFloat(sh.querySelector("#s_amt").value||"0");
    var note=(sh.querySelector("#s_note").value||"").trim();
    err.textContent="";
    if(!(amt>0)){ err.textContent="সঠিক পরিমাণ দিন"; return; }
    btn.disabled=true; btn.innerHTML='<span class="spin"></span>';
    var lid=uuid();
    push([{ entity:"sale", local_id:lid, op:"upsert", data:{ amount_paisa:Math.round(amt*100), sold_at:nowUtc(), note:note||null } }])
      .then(pullAll).then(function(){ mask.remove(); render(); toast("বিক্রি যোগ হয়েছে"); })
      .catch(function(e){ btn.disabled=false; btn.textContent="যোগ করুন"; err.textContent=pushErr(e); });
  };
  setTimeout(function(){ sh.querySelector("#s_amt").focus(); },50);
}
function pushErr(e){ if(e.code==="account_expired") return "সাবস্ক্রিপশনের মেয়াদ শেষ"; return friendly(e); }

// ---------- boot ----------
if(S.token){ loadingScreen(); pullAll().then(render).catch(function(e){
  if(e.status===401){ logout(); } else { toast(friendly(e)); render(); }
}); } else { render(); }
window.addEventListener("popstate", render);
})();
</script>
