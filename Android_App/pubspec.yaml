name: bakibondhu
description: "BakiBondhu — a Bangla-first, offline-first collection ledger for Bangladeshi micro-merchants (Android field app)."
publish_to: "none"
version: 0.1.15+16

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Offline-first local storage (the data layer mirrors the synced entities).
  sqflite: ^2.3.3
  path: ^1.9.0

  # Client-generated UUIDs so records can be created offline (spec §19).
  uuid: ^4.4.0

  # Launch the OS SMS composer / WhatsApp for merchant-triggered reminders (§9, §34).
  url_launcher: ^6.3.0

  # OS share sheet — export a customer's transaction statement to any app.
  share_plus: ^9.0.0

  # Small persisted settings (shop name, onboarding flag).
  shared_preferences: ^2.3.0

  # HTTP client for the sync API (push/pull to the backend).
  http: ^1.2.0

  # AES (used only to solve the shared-host "browser check" cookie — see
  # data/infinityfree_client.dart).
  pointycastle: ^3.9.1

  # Secure storage for the JWT access token (spec §22/§38).
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Bundle Noto Sans Bengali here once added (spec §33 — verify conjuncts on a
  # low-end device). Example:
  # fonts:
  #   - family: NotoSansBengali
  #     fonts:
  #       - asset: assets/fonts/NotoSansBengali-Regular.ttf
  #       - asset: assets/fonts/NotoSansBengali-SemiBold.ttf
  #         weight: 600
